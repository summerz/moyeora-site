<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1430" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>body{background:#1b1430;margin:0}</style>
    <title>모여라</title>
    <style>:root{--ink:#0e0a1c;--cream:#fff8e7;--lime:#8cff4d;--text:#ede6ff}body{color:var(--text);box-sizing:border-box;min-height:100dvh;padding:52px 20px 28px;font-family:Noto Sans KR,system-ui,sans-serif}main{max-width:420px;margin:0 auto}.chip{background:var(--lime);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 16px;font-family:Jua,sans-serif;font-size:20px;display:inline-block;transform:rotate(-2deg)}a.card{background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--lime);border-radius:20px;margin-top:36px;padding:22px;text-decoration:none;display:block;transform:rotate(-1.2deg)}a.card b{font-family:Jua,sans-serif;font-size:30px;font-weight:400;display:block}a.card span{font-size:15px}a.card:active{box-shadow:2px 2px 0 var(--lime);transform:rotate(-1.2deg)translate(3px,3px)}</style>
  </head>
  <body>
    <main>
      <span class="chip">모여라</span>
      <a class="card" href="sus-jar/"><b>수상한 통</b><span>통 안에 뭐가 들었을까?</span></a>
    </main>
  </body>
</html>
